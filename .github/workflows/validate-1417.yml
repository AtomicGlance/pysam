name: Validate PR 1417 compiled dispatcher
on:
  push:
    branches: [validation/1417-linux-20260922]
permissions:
  contents: read
jobs:
  dispatcher:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libbz2-dev libcurl4-openssl-dev liblzma-dev samtools bcftools tabix
      - run: python -m pip install Cython pytest setuptools
      - run: python setup.py build
      - name: Test compiled dispatcher
        run: PYTHONPATH=$(echo "$GITHUB_WORKSPACE"/build/lib.*) pytest tests/samtools_test.py -v
